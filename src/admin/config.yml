# Replace the "backend" object below with the snippet from DecapBridge. We need something here to get the CMS to work locally, but this alone won't work in production
backend:
    name: git-gateway

# Keep this to allow you to edit the cms locally
local_backend: true

# change url to a link to the image you want to use, no file paths, must be a URL
logo_url: https://codestitch.app/frontend/images/logo.png

# Image folders
media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"

# Decap CMS Collections
collections:
    - name: "blog"
      label: "Blog"
      folder: "src/content/blog"
      create: true
      slug: "{{slug}}"
      fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Search Title", name: "metaTitle", widget: "string", required: false, hint: "Keep this under 60 characters. This does not replace the visible article headline." }
          - { label: "Social Title", name: "ogTitle", widget: "string", required: true, hint: "Use 40-60 characters for the social preview title. The card headline is a separate field below." }
          - { label: "Social Description", name: "ogDescription", widget: "string", required: true, hint: "Use 100-125 characters that describe this article accurately." }
          - {
                label: "URL Slug",
                name: "url",
                widget: "string",
                hint: 'Specify where the page will be written to. If you use "Blog Post", the post will be accessible from "blog/blog-post"',
            }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Author", name: "author", widget: "string" }
          - { label: "Date", name: "date", widget: "datetime" }
          - { label: "Tags", name: "tags", widget: "list", default: ["post"] }
          - { label: "Featured Image", name: "image", widget: "image" }
          - { label: "Image Caption", name: "imageAlt", widget: "string" }
          - { label: "Create Branded OG Card", name: "ogCard", widget: "boolean", default: true, required: false }
          - { label: "Card Headline", name: "ogHeadline", widget: "string", required: true, hint: "Short headline for the image, up to 60 characters. Keep it readable across 2-4 lines." }
          - { label: "Card Supporting Line", name: "ogDetail", widget: "string", required: false, hint: "Optional short line below the card headline." }
          - { label: "Card Action", name: "ogAction", widget: "string", default: "Read the guide", required: true, hint: "A short action such as Read the guide or Read the checklist. Do not add a phone number." }
          - { label: "Card Photo", name: "ogPhoto", widget: "image", required: false, hint: "Use an existing site photo. If empty, the featured image is used." }
          - { label: "Card Photo Description", name: "ogPhotoAlt", widget: "string", required: false, hint: "Describe the photo itself. If empty, the article image alt text is used." }
          - { label: "OG Image Description", name: "ogImageAlt", widget: "string", required: true, hint: "Describe the whole composed card, including the photo, headline, supporting line, and action." }
          - { label: "OG Hero Position", name: "ogImagePosition", widget: "string", default: "center center", required: false, hint: "CSS object-position used by the OG image studio, for example center center or left center." }
          - { label: "Body", name: "body", widget: "markdown" }
