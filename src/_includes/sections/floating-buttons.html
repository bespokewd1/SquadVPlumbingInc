{% from "components/icons.html" import icon %}

<!-- Global mobile contact actions. Visual/device verification is deferred to final QA. -->
<section id="floating-buttons" class="lg:hidden">
  <nav aria-label="Quick contact actions" class="sv-action-nav">
    <div class="sv-action-panel">
      <div class="sv-action-grid">
        <a href="tel:{{ client.phoneForTel }}" aria-label="Call SquadV Plumbing" class="sv-action sv-action-primary">
          {{ icon("phone", "h-7 w-7 shrink-0") }}
          <span>Call Now</span>
        </a>
        <a href="sms:{{ client.phoneForTel }}" aria-label="Text SquadV Plumbing" class="sv-action">
          {{ icon("message-circle-filled", "h-7 w-7 shrink-0") }}
          <span>Text Us</span>
        </a>
        <a href="{{ client.whatsappLink }}" aria-label="WhatsApp SquadV Plumbing" target="_blank" rel="noopener noreferrer" class="sv-action">
          {{ icon("brand-whatsapp", "h-7 w-7 shrink-0") }}
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </nav>
</section>
