<!--                     CTA                      -->
<!-- ============================================ -->

<section id="cta-51">
    <div class="cs-container">
        <div class="cs-content">
            <h2 class="cs-title">Have a project like this?</h2>
            <p class="cs-text">Tell us what you need and get practical guidance from a certified Edmonton plumbing and gasfitting team.</p>

            <div class="cs-button-group">
                <a href="tel:{{ client.phoneForTel }}" class="cs-button-solid">Call for Service</a>
                <a href="/contact/" class="cs-button-solid cs-button-quote">Request a Quote</a>
            </div>
        </div>
    </div>
    <!-- Background Image-->
    <picture class="cs-picture">
        <!--Mobile Image-->
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 640, height: 812 }) | avif %}" type="image/avif">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 640, height: 812 }) | webp %}" type="image/webp">
        <source media="(max-width: 600px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 640, height: 812 }) | jpeg %}" type="image/jpeg">
        <!--Tablet Image-->
        <source media="(max-width: 1024px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 2048, height: 750 }) | avif %}" type="image/avif">
        <source media="(max-width: 1024px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 2048, height: 750 }) | webp %}" type="image/webp">
        <source media="(max-width: 1024px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 2048, height: 750 }) | jpeg %}" type="image/jpeg">
        <!--Desktop Image-->
        <source media="(min-width: 1024px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 2500, height: 555 }) | avif %}" type="image/avif">
        <source media="(min-width: 1024px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 2500, height: 555 }) | webp %}" type="image/webp">
        <source media="(min-width: 1024px)" srcset="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 2500, height: 555 }) | jpeg %}" type="image/jpeg">
        <img src="{% getUrl "/assets/images/gallery/plumbing/commercial-10.webp" | resize({ width: 2500, height: 555 }) | jpeg %}" alt="" width="1920" height="426" loading="lazy" decoding="async">
    </picture>
</section>
