<!-- A fully fleshed-out <head>, dynamically changing based on client.json and the page front matter -->

<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager: deferred until user interaction to keep initial load light -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function loadGoogleTagManager() {
        if (window.__gtmLoaded) return;
        window.__gtmLoaded = true;
        window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var firstScript = document.getElementsByTagName("script")[0];
        var tagManagerScript = document.createElement("script");
        tagManagerScript.async = true;
        tagManagerScript.src = "https://www.googletagmanager.com/gtm.js?id=GTM-NLZ33VG3";
        firstScript.parentNode.insertBefore(tagManagerScript, firstScript);
      }
      ["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (eventName) {
        window.addEventListener(eventName, loadGoogleTagManager, { once: true, passive: true });
      });
    </script>
    <!-- End Google Tag Manager -->

    <!-- Standard and page-specific metadata -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ client.domain }}{{ page.url }}" />
    <meta name="generator" content="{{ eleventy.generator }}" />

    <meta property="og:title" content="{{ ogTitle or title }}" />
    <meta property="og:description" content="{{ ogDescription or description }}" />
    <meta property="og:url" content="{{ ogUrl or (client.domain + page.url) }}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{ client.domain }}{{ ogImage or client.defaultOgImage }}" />

    <!--Favicons-->
    <!-- https://realfavicongenerator.net/ -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicons/squadVlogo.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/favicons/squadVlogo.png"
    />
    <link rel="shortcut icon" href="/assets/favicons/squadVlogo.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/squadVlogo.png"
    />
    <meta name="apple-mobile-web-app-title" content="Squad V Plumbing Inc" />
    <link rel="manifest" href="/assets/favicons/squadVlogo.png" />

    <!-- Preloads -->
    <link rel="preload" as="image" href="/assets/svgs/logo-black.svg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/roboto-v29-latin-regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/roboto-v29-latin-700.woff2"
      crossorigin
    />

    <!-- Sitewide Stylesheets and Scripts -->
    <link rel="stylesheet" href="/assets/css/root.css" />
    <script defer src="/assets/js/dark.js"></script>
    <script defer src="/assets/js/nav.js"></script>
    <script defer src="/assets/js/back-to-top.js"></script>

    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/assets/css/tailwind.css" />
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <title>{{ title }}</title>
  </head>
  <body class="has-mobile-actions">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-NLZ33VG3"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!--Screen reader skip main nav-->
    <a class="skip" aria-label="skip to main content" href="#main"
      >Click To Skip To Main Content</a
    >

    {% include "sections/header.html" %}
    <main id="main" class="site-main">{% block body %}{% endblock %}</main>
    {% include "sections/footer.html" %}
    <script>
      // Accordion functionality
      const toggles = document.querySelectorAll(".cs-accordion-toggle");

      toggles.forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const content = toggle.nextElementSibling;

          // Optional: close other open accordions
          toggles.forEach((t) => {
            if (t !== toggle) {
              t.nextElementSibling.style.maxHeight = null;
              t.classList.remove("active");
            }
          });

          // Toggle this accordion
          if (content.style.maxHeight) {
            content.style.maxHeight = null;
            toggle.classList.remove("active");
          } else {
            content.style.maxHeight = content.scrollHeight + "px";
            toggle.classList.add("active");
          }
        });
      });
    </script>

    {% include 'sections/floating-buttons.html' %}
    <button id="back-to-top" class="back-to-top-button" type="button" aria-label="Back to top" aria-hidden="true" tabindex="-1">
      <span aria-hidden="true">&#8593;</span>
    </button>
  </body>
</html>
