<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Plumber",
        "@id": "{{ client.domain }}/#business",
        "name": "{{ client.name | escape }}",
        "legalName": "{{ client.name | escape }}",
        "alternateName": "{{ client.brandName | escape }}",
        "description": "Licensed and insured plumbing, gasfitting, and renovation services for homes and businesses in Edmonton and surrounding areas.",
        "url": "{{ client.domain }}",
        "logo": "{{ client.domain }}/assets/svgs/logo-black.svg",
        "image": "{{ client.domain }}{{ client.defaultOgImage }}",
        "telephone": "{{ client.phoneForTel }}",
        "email": "{{ client.primaryEmail }}",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "{{ client.address.lineOne }}",
            "addressLocality": "{{ client.address.city }}",
            "addressRegion": "{{ client.address.state }}",
            "addressCountry": "{{ client.address.country }}"
        },
        "areaServed": "{{ client.serviceArea }}",
        "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday"
            ],
            "opens": "07:00",
            "closes": "17:00"
        },
        "hasMap": "{{ client.googleBusiness }}",
        "sameAs": ["{{ client.socials.facebook }}"]
    }
</script>
